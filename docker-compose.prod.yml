services:

  # ─── OWASP ZAP ───────────────────────────────────────
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: >
      zap.sh -daemon
      -host 0.0.0.0 -port 8080
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.disablekey=true
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/JSON/core/view/version/"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - loopsec-net

  # ─── FastAPI backend ──────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.prod
    environment:
      ZAP_HOST: http://zap:8080
    volumes:
      - loopsec-data:/data        # SQLite + work files persist across restarts
    depends_on:
      zap:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - loopsec-net

  # ─── React frontend (nginx) ───────────────────────────
  ui:
    image: loopsec-ui:latest
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - loopsec-net

volumes:
  loopsec-data:

networks:
  loopsec-net:
    driver: bridge
