name: "LoopSec — Full Security Scan"

on:
  push:
    branches: [main, master]
  schedule:
    # Every Monday at 6am UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  security-scan:
    name: Full Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan commits
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install LoopSec
        run: pip install -e ".[dev]"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s "https://api.github.com/repos/gitleaks/gitleaks/releases/latest" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          echo "Installing gitleaks v${GITLEAKS_VERSION}"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run full scan (SAST + Fix)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          loopsec scan \
            --repo . \
            --skip attacker verifier \
            --output loopsec-full-report.md
        # Exit code 1 = unfixed critical/high found; we capture that below
        continue-on-error: true

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loopsec-security-report
          path: |
            loopsec-full-report.md
            loopsec-report-*.json

      - name: Open fix PR if patches were generated
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Re-run in github-scan mode so it can open a PR with the patches
          loopsec github-scan "${{ github.repository }}" \
            --github-token "$GITHUB_TOKEN" \
            --branch "${{ github.ref_name }}" \
            --create-pr || echo "No patches to open a PR for"
