name: "LoopSec — Full Security Scan"

on:
  push:
    branches: [main, master]
  schedule:
    # Run weekly on Monday at 6am UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:    # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  security-scan:
    name: Full Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run LoopSec
        uses: kagozi/loopsec/action@main   # ← change to your repo
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: "gpt-4o"
          scan-mode: "full"          # Full pipeline: SAST + DAST + Fix
          create-pr: "true"          # Auto-create fix PR
          fail-on-high: "false"      # Don't fail the job — just create PR
