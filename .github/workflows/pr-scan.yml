name: "LoopSec — PR Security Scan"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install LoopSec
        run: pip install -e ".[dev]"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s "https://api.github.com/repos/gitleaks/gitleaks/releases/latest" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          echo "Installing gitleaks v${GITLEAKS_VERSION}"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run SAST scan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          loopsec scan \
            --repo . \
            --skip attacker verifier \
            --output loopsec-pr-report.md

      - name: Post findings summary as PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f loopsec-pr-report.md ]; then
            REPORT=$(cat loopsec-pr-report.md)
            gh pr comment ${{ github.event.pull_request.number }} \
              --body "## LoopSec Security Scan
          $REPORT" \
              --repo ${{ github.repository }} || true
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loopsec-pr-report
          path: |
            loopsec-pr-report.md
            loopsec-report-*.json

      - name: Fail if critical/high findings remain
        run: |
          # loopsec scan already exits 1 if critical/high are unfixed
          # This step just ensures the status is surfaced clearly
          echo "Scan complete. Check artifacts for full report."
