# ──────────────────────────────────────────────────────────
# LoopSec CI/CD Integration Templates
# ──────────────────────────────────────────────────────────
#
# Copy one or both of these workflows into your repo's
# .github/workflows/ directory.
#
# Prerequisites:
#   1. Add OPENAI_API_KEY to your repo secrets:
#      Settings → Secrets → Actions → New repository secret
#
#   2. GITHUB_TOKEN is provided automatically by GitHub Actions
#
# ──────────────────────────────────────────────────────────


# ══════════════════════════════════════════════════════════
# TEMPLATE 1: PR Security Gate
# ══════════════════════════════════════════════════════════
# Scans every PR for vulnerabilities.
# Posts findings as a PR comment.
# Blocks merge if critical/high issues found.
# Fast (~1-3 min) — SAST only, no Docker needed.
# ──────────────────────────────────────────────────────────

# File: .github/workflows/loopsec-pr.yml

name: "Security Scan (PR)"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  loopsec:
    name: LoopSec Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: kagozi/loopsec/action@main
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: "gpt-4o-mini"        # Fast + cheap for PR checks
          scan-mode: "sast"           # Static analysis only
          create-pr: "false"
          fail-on-high: "true"        # ← Block merge on critical/high


# ══════════════════════════════════════════════════════════
# TEMPLATE 2: Nightly Full Scan + Auto-Fix
# ══════════════════════════════════════════════════════════
# Runs the full pipeline: SAST + DAST + Fix + Verify.
# Auto-deploys your app via Docker sandbox.
# Creates a fix PR with verified patches.
# Runs nightly or on push to main.
# Slower (~5-15 min) — needs Docker.
# ──────────────────────────────────────────────────────────

